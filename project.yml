name: SpelunkrTV
options:
  bundleIdPrefix: org.fragmede
  deploymentTarget:
    tvOS: '18.0'
  xcodeVersion: '26.3'
  createIntermediateGroups: true
packages:
  SpelunkrCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 2
    DEVELOPMENT_TEAM: THSJJN6KNN
targets:
  SpelunkrTV:
    type: application
    platform: tvOS
    sources:
      - path: SpelunkrTV
    dependencies:
      - package: SpelunkrCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.onepatchdown.spelunkrtv
        PRODUCT_NAME: Spelunkr
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spelunkr
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 3
  SpelunkrTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests
    dependencies:
      - target: SpelunkrTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fragmede.SpelunkrTVUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SpelunkrTV:
    build:
      targets:
        SpelunkrTV: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpelunkrTVUITests
